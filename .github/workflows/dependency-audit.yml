# GitHub-hosted, independent of Dependabot alerts (including pnpm 12 graph gaps).
# Complete JSON reports are retained; no dependency installation in JS audits.
---
name: Dependency audit
"on":
  schedule:
    - cron: 46 5 * * *
  workflow_dispatch: {}
  pull_request:
    paths:
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "**/package-lock.json"
      - "**/npm-shrinkwrap.json"
      - ".github/workflows/dependency-audit.yml"
  push:
    branches:
      - main
    paths:
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "**/package-lock.json"
      - "**/npm-shrinkwrap.json"
      - ".github/workflows/dependency-audit.yml"
permissions:
  contents: read
concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Audit every locked runtime and development dependency
        run: |
          # Read the existing lock only; do not install packages or run lifecycle scripts.
          set +e
          npm audit --json > dependency-audit.json
          native_status=$?
          set -e
          NATIVE_AUDIT_STATUS="$native_status" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('dependency-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities;
          if (report.error || !counts || !Number.isFinite(counts.high) || !Number.isFinite(counts.critical)) {
            throw new Error('Audit feed failed or returned an unsupported report; inspect the artifact.');
          }
          const status = Number(process.env.NATIVE_AUDIT_STATUS);
          console.log('Complete vulnerability counts:', JSON.stringify(counts));
          if (status > 1 || (status !== 0 && !Object.values(counts).some(value => Number(value) > 0))) {
            throw new Error(`Native audit failed with status ${status}.`);
          }
          if (counts.high + counts.critical > 0) process.exit(1);
          NODE
      - name: Retain complete audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-audit
          path: dependency-audit.json
          retention-days: 30
          if-no-files-found: error
