name: Release

# Publishes to npm. It fires on a version tag and on nothing else — not on a
# push to `main`, not on a manual dispatch of an arbitrary ref. Publishing is
# effectively irreversible, so the trigger is the narrowest one that works.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # The same gate a pull request runs, by reference rather than by copy. A tag
  # whose tree fails typecheck or tests never reaches the publish job.
  gate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: gate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for the runner to mint the OIDC token that authenticates the
      # publish. This is the only credential in the workflow — remove it and
      # the publish has no way to authenticate at all.
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Trusted publishing requires Node >= 22.14.0, so the publish job
          # does not use the gate matrix's floor of 20.
          node-version: '24'
          # Point npm at the public registry explicitly, so a publish cannot
          # inherit some other default and then fail against a trusted
          # publisher configured for npmjs.org. The `.npmrc` setup-node writes
          # does reference `NODE_AUTH_TOKEN`, which is deliberately never set
          # here; verified on 2026-08-08 that npm tolerates that variable being
          # undefined rather than erroring on config expansion.
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Use an npm that understands trusted publishing
        # 11.5.1 is npm's stated minimum for OIDC trusted publishing. The
        # runner image's bundled npm is not guaranteed to be past it, and the
        # failure if it is not is an auth error rather than a version error, so
        # install explicitly rather than hoping.
        run: npm install -g "npm@^11.5.1"

      # Cheapest possible failure, so it goes first. Publishing 0.1.0 from a
      # tag that reads v0.2.0 is not noticed until it is permanent.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME}"
          pkg="v$(npm pkg get version | tr -d '"')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ${tag} does not match package.json version ${pkg}. Fix one of them, delete the tag, and re-tag."
            exit 1
          fi
          echo "Tag ${tag} matches package.json version ${pkg}."

      - name: Install
        run: npm ci

      # Publish what this job built, not anything committed. `dist/` is
      # gitignored, so the tarball's contents exist only because of this step
      # and the `prepare` that `npm ci` already ran.
      - name: Build
        run: npm run build

      # AUTHENTICATION — read this before changing it.
      #
      # This publishes over OIDC trusted publishing. There is no npm token in
      # this step, no `NPM_TOKEN` secret in this repository, and there should
      # never be one. The `id-token: write` permission granted above and the
      # npm pinned further up are the whole mechanism.
      #
      # Why 0.1.0 was not released by this workflow: npm cannot attach a
      # trusted publisher to a package that does not exist on the registry yet
      # (npm/cli#8544, open — it asks for the PyPI-style pending publisher that
      # would close the gap). The only alternative was a bootstrap token with
      # read and write over every package in the account, created to ship one
      # version. So 0.1.0 was published by hand, once, behind an interactive
      # 2FA challenge, and this workflow's first real use is the version after
      # it.
      #
      # If a publish here fails with an auth error, the answer is NOT to add a
      # secret. Check the trusted publisher on npmjs.com — the package's
      # Settings, then Trusted Publisher — and confirm it names this repository
      # and the workflow filename `release.yml` exactly. Adding a token would
      # appear to fix it while quietly giving up the property that makes this
      # safe: that nothing long-lived exists to be stolen.
      #
      # `--provenance` is deliberately absent. Trusted publishing generates
      # provenance attestations on its own and npm's documentation is explicit
      # that the flag is not required, so do not add it speculatively. There
      # are field reports of the flag being needed anyway; if a published
      # version turns out to carry no attestation, the flag is the fix — but
      # confirm the absence before reaching for it.
      - name: Publish to npm
        run: npm publish
